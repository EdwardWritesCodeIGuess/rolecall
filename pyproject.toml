[project]
name = "rolecall"
version = "0.1.0"
description = "Rolecall: permission-first GTA RP clipping pipeline (ingest, rank, render 9:16, review, publish)."
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "numpy>=1.26",
  "pillow>=10.4",
  "cryptography>=43",
  "faster-whisper>=1.1",
  "yt-dlp>=2025.1.1",
  "anthropic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rolecall = "rolecall.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rolecall*"]

[tool.setuptools.package-data]
rolecall = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
markers = ["slow: full pipeline tests (ffmpeg + whisper)"]
addopts = "-q"
