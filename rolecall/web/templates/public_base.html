<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="{{ brand }} turns GTA roleplay streams into short-form clips, with the streamer's permission.">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="public">
