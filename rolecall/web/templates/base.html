<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ brand }} dashboard{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
{% if paused %}<div class="paused-bar">Publishing is PAUSED: nothing goes public until you resume it on the Overview page.</div>{% endif %}
<header class="top">
  <a class="logo" href="/"><span>RC</span>{{ brand }}</a>
  <nav>
    {% set p = request.url.path %}
    <a href="/" class="{{ 'on' if p == '/' }}">Overview</a>
    <a href="/clips?status=needs_review" class="{{ 'on' if p.startswith('/clips') }}">Clips</a>
    <a href="/posts" class="{{ 'on' if p.startswith('/posts') }}">Posts</a>
    <a href="/sources" class="{{ 'on' if p.startswith('/sources') }}">Sources</a>
    <a href="/creators" class="{{ 'on' if p.startswith('/creators') }}">Streamers</a>
    <a href="/metrics" class="{{ 'on' if p.startswith('/metrics') }}">Metrics</a>
    <a href="/leads" class="{{ 'on' if p.startswith('/leads') }}">Leads</a>
    <a href="/requests" class="{{ 'on' if p.startswith('/requests') }}">Requests</a>
    <a href="/connections" class="{{ 'on' if p.startswith('/connections') }}">Connections</a>
    <a href="/events" class="{{ 'on' if p.startswith('/events') }}">Log</a>
  </nav>
  <div class="spacer"></div>
  <span class="muted small">@{{ handle }}</span>
</header>
<main>{% block body %}{% endblock %}</main>
<script>
document.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', () => {
  const t = document.getElementById(b.dataset.copy); navigator.clipboard.writeText(t.value || t.textContent);
  b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy', 1200);
}));
document.querySelectorAll('form[data-confirm]').forEach(f => f.addEventListener('submit', e => {
  if (!confirm(f.dataset.confirm)) e.preventDefault();
}));
</script>
</body>
</html>
